<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolly Classroom Games — Teacher Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg: #161f16;
  --panel: #2b2015;
  --panel-alt: #3a2c1b;
  --brass: #c9a24b;
  --brass-bright: #e8c96b;
  --brass-dim: #7a6633;
  --success: #5a9e5f;
  --danger: #a8453a;
  --text: #ece3d0;
  --text-dim: #a89a80;
  --border: #4a3826;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

h1, h2 {
  color: var(--brass-bright);
  margin-top: 0;
}

.panel {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
}

.btn {
  background: var(--brass);
  color: #1a1a1a;
  border: none;
  padding: 10px 16px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
}

.btn:hover {
  background: var(--brass-bright);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-secondary {
  background: var(--panel-alt);
  color: var(--text);
  border: 1px solid var(--border);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}

.team-card {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.team-card.finished {
  border-color: var(--success);
}

.timer-display {
  font-size: 3rem;
  color: var(--brass-bright);
  font-weight: bold;
  text-align: center;
  background: #000;
  padding: 10px;
  border-radius: 6px;
  margin: 10px 0;
}

.flex-gap {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

input, select {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 4px;
  font-family: inherit;
}

#qrcode {
  background: #fff;
  padding: 10px;
  border-radius: 4px;
  display: inline-block;
}

.status {
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 0.85rem;
}

.status.connected {
  color: var(--success);
  border: 1px solid var(--success);
}

.status.waiting {
  color: var(--brass-bright);
  border: 1px solid var(--brass);
}

.status.error {
  color: var(--danger);
  border: 1px solid var(--danger);
}

.room-code {
  font-size: 2rem;
  letter-spacing: 4px;
  color: var(--brass-bright);
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <!-- SETUP -->
  <div id="setupScreen" class="panel">

    <h1>Vault Escape</h1>
    <h2>Teacher Command Dashboard</h2>

    <div id="authStatus" class="status waiting">
      Connecting to Firebase...
    </div>

    <div style="margin-top:20px; margin-bottom:15px;">
      <label>Timer Duration (Minutes): </label>
      <input
        type="number"
        id="timeMinutes"
        value="45"
        min="1"
        max="180">
    </div>

    <div style="margin-bottom:15px;">
      <label>Team Naming Style: </label>
      <select id="namingStyle" onchange="generateTeams()">
        <option value="sleuth">Sleuth / Cipher Names</option>
        <option value="colors">Color Names</option>
        <option value="custom">Custom Names</option>
      </select>
    </div>

    <div style="margin-bottom:15px;">
      <label>Number of Teams: </label>
      <input
        type="number"
        id="teamCount"
        value="6"
        min="1"
        max="12"
        onchange="generateTeams()">
    </div>

    <div id="customNamesContainer" style="margin-bottom:15px;"></div>

    <button
      class="btn"
      id="createRoomBtn"
      onclick="createNewRoom()"
      disabled>
      Generate Live Room
    </button>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboardScreen" class="panel" hidden>

    <div class="flex-gap" style="justify-content:space-between;">

      <div>
        <h2>
          Room Code:
          <span id="roomCodeDisplay" class="room-code">------</span>
        </h2>

        <p style="margin:2px 0;">
          Student Join URL:
          <strong id="studentUrlDisplay" style="color:var(--brass);"></strong>
        </p>

        <div id="connectionStatus"
             class="status connected"
             style="display:inline-block; margin-top:10px;">
          Connected
        </div>
      </div>

      <div id="qrcode"></div>

    </div>


    <div class="timer-display" id="timerDisplay">
      45:00
    </div>


    <!-- CONTROLS -->
    <div
      class="flex-gap"
      style="justify-content:center; margin-bottom:20px;">

      <button
        class="btn"
        onclick="controlGame('start')">
        Start
      </button>

      <button
        class="btn btn-secondary"
        onclick="controlGame('pause')">
        Pause
      </button>

      <button
        class="btn btn-secondary"
        onclick="controlGame('reset')">
        Reset Timer
      </button>

      <button
        class="btn btn-danger"
        onclick="controlGame('end')">
        End Game
      </button>

    </div>


    <h2>Live Team Progress</h2>

    <div id="teamGrid" class="grid"></div>

  </div>

</div>


<script>

/* ============================================================
   FIREBASE CONFIGURATION
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyD1UphrW9EuX4RUQXDhEMv7MoRMwLUHwpM",
  authDomain: "jolly-classroom-games.firebaseapp.com",
  databaseURL: "https://jolly-classroom-games-default-rtdb.firebaseio.com",
  projectId: "jolly-classroom-games",
  storageBucket: "jolly-classroom-games.firebasestorage.app",
  messagingSenderId: "511334738685",
  appId: "1:511334738685:web:27ec8d6cc1142465572c94",
  measurementId: "G-CSXS09R5VX"
};


/* ============================================================
   INITIALIZE FIREBASE
   ============================================================ */

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();


/* ============================================================
   GLOBAL STATE
   ============================================================ */

let currentRoomId = null;
let roomRef = null;
let currentUser = null;


/* ============================================================
   TEAM NAMES
   ============================================================ */

const SLEUTH_NAMES = [
  'Cipher Squad',
  'Vault Breakers',
  'The Locksmiths',
  'Code Crackers',
  'Silent Alarm',
  'Safecrackers',
  'The Tumblers',
  'Skeleton Keys',
  'Dead Drop Crew',
  'Shadow Agents',
  'Iron Vault',
  'Master Keys'
];

const COLOR_NAMES = [
  'Red Team',
  'Blue Team',
  'Green Team',
  'Yellow Team',
  'Purple Team',
  'Orange Team',
  'Silver Team',
  'Gold Team',
  'Bronze Team',
  'Copper Team',
  'Cobalt Team',
  'Crimson Team'
];


/* ============================================================
   AUTHENTICATION
   ============================================================ */

auth.onAuthStateChanged(user => {

  if (!user) {
    document.getElementById('authStatus').textContent =
      'Authentication failed.';

    document.getElementById('authStatus').className =
      'status error';

    return;
  }

  currentUser = user;

  document.getElementById('authStatus').textContent =
    'Firebase connected — teacher session ready.';

  document.getElementById('authStatus').className =
    'status connected';

  document.getElementById('createRoomBtn').disabled = false;

});


auth.signInAnonymously()
  .catch(error => {

    console.error('Anonymous authentication failed:', error);

    document.getElementById('authStatus').textContent =
      'Could not connect to Firebase.';

    document.getElementById('authStatus').className =
      'status error';

  });


/* ============================================================
   TEAM SETUP
   ============================================================ */

function generateTeams() {

  const count =
    parseInt(document.getElementById('teamCount').value) || 4;

  const style =
    document.getElementById('namingStyle').value;

  const container =
    document.getElementById('customNamesContainer');

  container.innerHTML = '';

  if (style === 'custom') {

    for (let i = 0; i < count; i++) {

      container.innerHTML += `
        <input
          type="text"
          class="custom-team-input"
          value="Team ${i + 1}"
          style="margin:2px;">
      `;

    }

  }

}


generateTeams();


function getTeamNames() {

  const count =
    parseInt(document.getElementById('teamCount').value) || 4;

  const style =
    document.getElementById('namingStyle').value;

  let names = [];

  if (style === 'sleuth') {

    names = SLEUTH_NAMES.slice(0, count);

  } else if (style === 'colors') {

    names = COLOR_NAMES.slice(0, count);

  } else {

    document
      .querySelectorAll('.custom-team-input')
      .forEach(input => {

        names.push(
          input.value.trim() || 'Team'
        );

      });

  }

  return names;

}


/* ============================================================
   ROOM CREATION
   ============================================================ */

async function createNewRoom() {

  if (!currentUser) {
    alert('Firebase is not connected yet.');
    return;
  }

  try {

    const roomCode =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    currentRoomId = roomCode;

    const minutes =
      parseInt(
        document.getElementById('timeMinutes').value
      ) || 45;

    const names = getTeamNames();

    const initialTeams = {};

    names.forEach((name, idx) => {

      initialTeams[`team_${idx}`] = {

        name: name,

        progress: 0,

        finished: false,

        finishTime: null

      };

    });


    const now = firebase.database.ServerValue.TIMESTAMP;

    const roomData = {

      teacherUid: currentUser.uid,

      createdAt: now,

      expiresAt:
        Date.now() + (24 * 60 * 60 * 1000),

      durationSeconds: minutes * 60,

      secondsRemaining: minutes * 60,

      status: 'setup',

      teams: initialTeams,

      players: {}

    };


    roomRef =
      db.ref('rooms/' + currentRoomId);


    await roomRef.set(roomData);


    setupDashboardUI();

    listenToRoomUpdates();

  } catch (error) {

    console.error(error);

    alert(
      'Could not create room.\n\n' +
      error.message
    );

  }

}


/* ============================================================
   DASHBOARD UI
   ============================================================ */

function setupDashboardUI() {

  document.getElementById('setupScreen').hidden = true;

  document.getElementById('dashboardScreen').hidden = false;

  document.getElementById('roomCodeDisplay').textContent =
    currentRoomId;


  const studentUrlObj =
    new URL(
      'student-node.html',
      window.location.href
    );

  studentUrlObj.searchParams.set(
    'room',
    currentRoomId
  );

  const studentUrl =
    studentUrlObj.href;


  document.getElementById('studentUrlDisplay')
    .textContent = studentUrl;


  const qrContainer =
    document.getElementById('qrcode');

  qrContainer.innerHTML = '';


  if (window.QRCode) {

    new QRCode(qrContainer, {

      text: studentUrl,

      width: 160,

      height: 160

    });

  }

}


/* ============================================================
   REALTIME ROOM LISTENER
   ============================================================ */

function listenToRoomUpdates() {

  if (!roomRef) return;

  roomRef.on('value', snapshot => {

    const data = snapshot.val();

    if (!data) return;


    const seconds =
      Math.max(
        0,
        Number(data.secondsRemaining || 0)
      );


    const minutes =
      Math.floor(seconds / 60)
        .toString()
        .padStart(2, '0');

    const secs =
      (seconds % 60)
        .toString()
        .padStart(2, '0');


    document.getElementById('timerDisplay')
      .textContent =
      `${minutes}:${secs}`;


    renderTeams(data.teams || {});


    const status =
      document.getElementById('connectionStatus');

    status.textContent =
      `Game Status: ${String(data.status || 'unknown').toUpperCase()}`;

  });

}


/* ============================================================
   RENDER TEAM CARDS
   ============================================================ */

function renderTeams(teams) {

  const grid =
    document.getElementById('teamGrid');

  grid.innerHTML = '';


  Object.keys(teams).forEach(key => {

    const team = teams[key];

    const card =
      document.createElement('div');

    card.className =
      `team-card ${team.finished ? 'finished' : ''}`;


    let locksHtml = '';

    for (let i = 1; i <= 6; i++) {

      const solved =
        i <= Number(team.progress || 0);

      locksHtml += `
        <span
          style="
            font-size:1.4rem;
            margin-right:5px;
          ">
          ${solved ? '🔓' : '🔒'}
        </span>
      `;

    }


    card.innerHTML = `

      <h3 style="margin:0 0 10px 0;">
        ${escapeHtml(team.name)}
      </h3>

      <div>
        ${locksHtml}
      </div>

      <p
        style="
          font-size:0.85rem;
          color:var(--text-dim);
        ">
        Locks Unlocked:
        ${Number(team.progress || 0)} / 6
      </p>

      ${
        team.finished
        ? `
          <p
            style="
              color:var(--success);
              font-weight:bold;
            ">
            Escaped!
            ${escapeHtml(team.finishTime || '')}
          </p>
        `
        : ''
      }

      ${
        Number(team.progress || 0) < 6
        ? `
          <button
            class="btn btn-secondary"
            style="
              font-size:0.75rem;
              margin-top:8px;
            "
            onclick="
              overrideSkipLock(
                '${key}',
                ${Number(team.progress || 0)}
              )
            ">
            Teacher Override: Skip Lock
          </button>
        `
        : ''
      }

    `;


    grid.appendChild(card);

  });

}


/* ============================================================
   TEACHER CONTROLS
   ============================================================ */

async function controlGame(action) {

  if (!roomRef) return;

  try {

    if (action === 'start') {

      await roomRef.update({
        status: 'running'
      });

    }


    if (action === 'pause') {

      await roomRef.update({
        status: 'paused'
      });

    }


    if (action === 'end') {

      await roomRef.update({
        status: 'ended'
      });

    }


    if (action === 'reset') {

      const minutes =
        parseInt(
          document.getElementById('timeMinutes').value
        ) || 45;

      await roomRef.update({

        status: 'setup',

        secondsRemaining:
          minutes * 60

      });

    }

  } catch (error) {

    console.error(error);

    alert(
      'Firebase could not update the game.\n\n' +
      error.message
    );

  }

}


/* ============================================================
   TIMER
   ============================================================ */

setInterval(async () => {

  if (!roomRef) return;

  try {

    const snapshot =
      await roomRef.child('status').once('value');

    if (snapshot.val() !== 'running') {
      return;
    }


    await roomRef
      .child('secondsRemaining')
      .transaction(current => {

        if (current === null) {
          return 0;
        }

        if (current <= 1) {
          return 0;
        }

        return current - 1;

      });

  } catch (error) {

    console.error(
      'Timer update error:',
      error
    );

  }

}, 1000);


/* ============================================================
   TEACHER OVERRIDE
   ============================================================ */

async function overrideSkipLock(
  teamKey,
  currentProgress
) {

  if (!roomRef || !currentUser) return;

  if (currentProgress >= 6) return;


  const newProgress =
    currentProgress + 1;


  const updates = {};

  updates[
    `teams/${teamKey}/progress`
  ] = newProgress;


  if (newProgress === 6) {

    updates[
      `teams/${teamKey}/finished`
    ] = true;

    updates[
      `teams/${teamKey}/finishTime`
    ] =
      document.getElementById(
        'timerDisplay'
      ).textContent;

  }


  try {

    await roomRef.update(updates);

  } catch (error) {

    console.error(error);

    alert(
      'Could not skip lock.\n\n' +
      error.message
    );

  }

}


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>
</html>
