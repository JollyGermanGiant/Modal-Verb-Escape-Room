<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  Jolly Classroom Games — Student Portal
</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<style>

:root {

  --bg: #161f16;
  --panel: #2b2015;
  --panel-alt: #3a2c1b;
  --brass: #c9a24b;
  --brass-bright: #e8c96b;
  --success: #5a9e5f;
  --danger: #d16b57;
  --text: #ece3d0;
  --text-dim: #a89a80;
  --border: #4a3826;

  --font-mono:
    'JetBrains Mono',
    'Courier New',
    monospace;

}

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 16px;

  background: var(--bg);

  color: var(--text);

  font-family: var(--font-mono);

}

.container {

  max-width: 650px;

  margin: 0 auto;

}

.panel {

  background: var(--panel);

  border:
    2px solid
    var(--border);

  border-radius: 8px;

  padding: 20px;

  margin-bottom: 16px;

}

.timer-bezel {

  background: #000;

  color: var(--brass-bright);

  font-size: 1.8rem;

  font-weight: bold;

  text-align: center;

  padding: 8px;

  border-radius: 4px;

  border:
    1px solid
    var(--brass);

}

input,
select,
button {

  font-family: inherit;

  font-size: 1rem;

  padding: 10px;

  border-radius: 4px;

}

input[type=text],
select {

  background: var(--panel-alt);

  border:
    1px solid
    var(--border);

  color: var(--text);

  width: 100%;

}

.btn {

  background: var(--brass);

  color: #1a1a1a;

  border: none;

  font-weight: bold;

  cursor: pointer;

  width: 100%;

  margin-top: 10px;

}

.btn:hover {

  background:
    var(--brass-bright);

}

.btn:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}

.lock-header {

  color: var(--brass-bright);

  border-bottom:
    1px solid
    var(--border);

  padding-bottom: 8px;

}

.feedback {

  margin-top: 10px;

  padding: 10px;

  border-radius: 4px;

  text-align: center;

  font-weight: bold;

}

.feedback.correct {

  background:
    rgba(90, 158, 95, 0.2);

  color: var(--success);

  border:
    1px solid
    var(--success);

}

.feedback.wrong {

  background:
    rgba(209, 107, 87, 0.2);

  color: var(--danger);

  border:
    1px solid
    var(--danger);

}

.unlock-anim {

  animation:
    pulseGreen
    0.8s
    ease-in-out;

}

@keyframes pulseGreen {

  0% {

    transform: scale(1);

    box-shadow:
      0 0 0px
      var(--success);

  }

  50% {

    transform: scale(1.03);

    box-shadow:
      0 0 20px
      var(--success);

  }

  100% {

    transform: scale(1);

    box-shadow:
      0 0 0px
      var(--success);

  }

}

.shake {

  animation:
    shake
    0.35s;

}

@keyframes shake {

  10%, 90% {
    transform: translateX(-2px);
  }

  20%, 80% {
    transform: translateX(4px);
  }

  30%, 50%, 70% {
    transform: translateX(-8px);
  }

  40%, 60% {
    transform: translateX(8px);
  }

}

.connection {

  font-size: 0.8rem;

  color:
    var(--text-dim);

}

.connection.online {

  color:
    var(--success);

}

.connection.offline {

  color:
    var(--danger);

}

[hidden] {

  display: none !important;

}

</style>

</head>


<body>


<div class="container">


<!-- ============================================================
     JOIN SCREEN
     ============================================================ -->

<div
  id="joinScreen"
  class="panel">

  <h2 style="color:var(--brass-bright)">
    Vault Escape — Student Join
  </h2>


  <div
    id="authStatus"
    class="connection">

    Connecting to Firebase...

  </div>


  <div style="margin-bottom:12px;">

    <label>
      Room Code:
    </label>

    <input
      type="text"
      id="roomCodeInput"
      style="text-transform:uppercase"
      placeholder="e.g. AB12CD">

  </div>


  <button
    type="button"
    class="btn"
    id="connectBtn"
    onclick="connectToRoom()">

    Connect to Vault

  </button>


  <div
    id="joinStatus"
    style="
      margin-top:10px;
      font-size:0.85rem;
      color:var(--text-dim);
    ">

  </div>


  <div
    id="selectTeamArea"
    style="margin-top:15px;"
    hidden>

    <label>
      Select Your Team:
    </label>

    <select
      id="teamDropdown">
    </select>


    <button
      type="button"
      class="btn"
      onclick="enterGame()">

      Enter Control Room

    </button>

  </div>

</div>



<!-- ============================================================
     GAME SCREEN
     ============================================================ -->

<div
  id="gameScreen"
  hidden>


  <div
    class="panel"
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
    ">

    <div>

      <h3
        id="teamNameHeading"
        style="
          margin:0;
          color:var(--text);
        ">

        Team

      </h3>


      <span
        id="gameStatusTag"
        class="connection online">

        Connected

      </span>

    </div>


    <div
      class="timer-bezel"
      id="studentTimer">

      45:00

    </div>

  </div>


  <div
    id="lockCard"
    class="panel">
  </div>

</div>


</div>


<script>


/* ============================================================
   FIREBASE CONFIG
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyD1UphrW9EuX4RUQXDhEMv7MoRMwLUHwpM",
  authDomain: "jolly-classroom-games.firebaseapp.com",
  databaseURL: "https://jolly-classroom-games-default-rtdb.firebaseio.com",
  projectId: "jolly-classroom-games",
  storageBucket: "jolly-classroom-games.firebasestorage.app",
  messagingSenderId: "511334738685",
  appId: "1:511334738685:web:27ec8d6cc1142465572c94"
};


if (!firebase.apps.length) {

  firebase.initializeApp(
    firebaseConfig
  );

}


const auth =
  firebase.auth();

const db =
  firebase.database();


/* ============================================================
   STATE
   ============================================================ */

let currentUser = null;

let roomId = null;

let teamKey = null;

let roomRef = null;

let localProgress = -1;


/* ============================================================
   AUTHENTICATION
   ============================================================ */

auth.onAuthStateChanged(user => {

  if (!user) {

    document.getElementById(
      'authStatus'
    ).textContent =
      'Authentication failed.';

    document.getElementById(
      'authStatus'
    ).className =
      'connection offline';

    return;

  }


  currentUser = user;


  document.getElementById(
    'authStatus'
  ).textContent =
    'Connected to Firebase.';


  document.getElementById(
    'authStatus'
  ).className =
    'connection online';


  // If a room was supplied in the URL,
  // connect automatically.

  const params =
    new URLSearchParams(
      window.location.search
    );

  const roomParam =
    params.get('room');


  if (roomParam) {

    document.getElementById(
      'roomCodeInput'
    ).value =
      roomParam
        .trim()
        .toUpperCase();

    connectToRoom();

  }

});


auth.signInAnonymously()
  .catch(error => {

    console.error(
      'Anonymous authentication failed:',
      error
    );

    document.getElementById(
      'authStatus'
    ).textContent =
      'Could not connect to Firebase.';

    document.getElementById(
      'authStatus'
    ).className =
      'connection offline';

  });


/* ============================================================
   CONNECT TO ROOM
   ============================================================ */

async function connectToRoom() {

  if (!currentUser) {

    document.getElementById(
      'joinStatus'
    ).textContent =
      'Still connecting to Firebase. Please wait a moment.';

    return;

  }


  roomId =
    document.getElementById(
      'roomCodeInput'
    ).value
      .trim()
      .toUpperCase();


  const statusEl =
    document.getElementById(
      'joinStatus'
    );

  const btn =
    document.getElementById(
      'connectBtn'
    );


  if (!roomId) {

    statusEl.textContent =
      'Please enter a room code.';

    return;

  }


  btn.disabled = true;


  statusEl.textContent =
    'Connecting to vault server...';


  roomRef =
    db.ref(
      'rooms/' + roomId
    );


  try {

    const snapshot =
      await roomRef.once('value');


    btn.disabled = false;


    if (!snapshot.exists()) {

      statusEl.textContent =
        'Room code not found.';

      statusEl.style.color =
        'var(--danger)';

      return;

    }


    const data =
      snapshot.val();


    if (
      data.expiresAt &&
      Date.now() > data.expiresAt
    ) {

      statusEl.textContent =
        'This game room has expired.';

      statusEl.style.color =
        'var(--danger)';

      return;

    }


    statusEl.textContent =
      'Vault found! Select your team.';

    statusEl.style.color =
      'var(--success)';


    const teams =
      data.teams || {};


    const dropdown =
      document.getElementById(
        'teamDropdown'
      );


    dropdown.innerHTML = '';


    Object.keys(teams)
      .forEach(key => {

        const option =
          document.createElement(
            'option'
          );

        option.value = key;

        option.textContent =
          teams[key].name;

        dropdown.appendChild(
          option
        );

      });


    document.getElementById(
      'selectTeamArea'
    ).hidden = false;


  } catch (error) {

    console.error(error);

    btn.disabled = false;

    statusEl.textContent =
      'Connection error: ' +
      error.message;

    statusEl.style.color =
      'var(--danger)';

  }

}


/* ============================================================
   ENTER GAME
   ============================================================ */

async function enterGame() {

  if (!currentUser || !roomRef) {
    return;
  }


  teamKey =
    document.getElementById(
      'teamDropdown'
    ).value;


  const teamName =
    document.getElementById(
      'teamDropdown'
    )
      .selectedOptions[0]
      .textContent;


  /*
    Record this anonymous student as a
    member of the selected team.
  */

  try {

    await roomRef
      .child(
        `players/${currentUser.uid}`
      )
      .set({

        team:
          teamKey,

        joinedAt:
          firebase.database.ServerValue.TIMESTAMP

      });

  } catch (error) {

    console.error(
      'Could not register player:',
      error
    );

  }


  document.getElementById(
    'joinScreen'
  ).hidden = true;


  document.getElementById(
    'gameScreen'
  ).hidden = false;


  document.getElementById(
    'teamNameHeading'
  ).textContent =
    teamName;


  listenToRoom();

}
  
/* ============================================================
   ROOM LISTENER (FIXED)
   ============================================================ */

function listenToRoom() {

  roomRef.on(
    'value',
    snapshot => {

      const data = snapshot.val();

      if (!data) return;

      // 1. UPDATE TIMER (ONLY touches the timer bezel text)
      const seconds = Math.max(0, Number(data.secondsRemaining || 0));
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');

      const timerEl = document.getElementById('studentTimer');
      if (timerEl) {
        timerEl.textContent = `${minutes}:${secs}`;
      }

      // 2. UPDATE STATUS TAG
      const statusTag = document.getElementById('gameStatusTag');
      if (statusTag) {
        statusTag.textContent = String(data.status || 'setup').toUpperCase();
      }

      // 3. CHECK TEAM PROGRESS
      const teamData = data.teams && data.teams[teamKey];
      if (!teamData) return;

      document.getElementById('teamNameHeading').textContent = teamData.name;

      const serverProgress = Number(teamData.progress || 0);

      // ONLY re-render the lock puzzle if progress level has changed!
      // On initial load (localProgress === -1) or when moving to next lock.
      if (localProgress === -1 || serverProgress > localProgress) {
        localProgress = serverProgress;
        renderLockPuzzle(localProgress, teamData.finished);
      }

    }
  );

}
/* ============================================================
   RENDER PUZZLES
   ============================================================ */

function renderLockPuzzle(
  progress,
  finished
) {

  const container =
    document.getElementById(
      'lockCard'
    );


  container.classList.remove(
    'unlock-anim'
  );


  if (
    finished ||
    progress >= 6
  ) {

    container.innerHTML = `

      <h2
        style="
          color:var(--success);
          text-align:center;
        ">

        🔓 VAULT OPENED!

      </h2>


      <p
        style="
          text-align:center;
        ">

        Congratulations!

        Your team successfully
        decoded all six security locks
        and escaped the room!

      </p>

    `;

    return;

  }


  if (progress === 0) {
    container.innerHTML = `
      <h3 class="lock-header">
        LOCK 1 — Der verschlossene Klassenraum (können)
      </h3>

      <p>
        <i>„Nur wer zeigen kann, was er kann, darf weitergehen."</i>
      </p>

      <p>
        <b>Teil 1: Conjugation Check</b>
      </p>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px;">
        <div>
          ich
          <input type="text" id="l1_1" placeholder="Form">
        </div>
        <div>
          wir
          <input type="text" id="l1_4" placeholder="Form">
        </div>
        <div>
          du
          <input type="text" id="l1_2" placeholder="Form">
        </div>
        <div>
          ihr
          <input type="text" id="l1_5" placeholder="Form">
        </div>
        <div>
          er/sie/es
          <input type="text" id="l1_3" placeholder="Form">
        </div>
        <div>
          sie/Sie
          <input type="text" id="l1_6" placeholder="Form">
        </div>
      </div>

      <p>
<p>
  <b>Teil 2: Ergänzt die Sätze.</b><br>
  <span style="font-size: 0.9rem; color: #aaa; font-style: italic;">
    Benutzt die richtige Form von <strong>können</strong>. Achtet auf die Wortstellung!
  </span>
</p>

<ol style="margin-bottom: 16px; padding-left: 20px; line-height: 2;">
  <li>Ich <input type="text" id="s1" style="width: 90px;" placeholder="Form"> gut schwimmen.</li>
  <li>Wir <input type="text" id="s2" style="width: 90px;" placeholder="Form"> heute nicht bleiben.</li>
  <li>Er <input type="text" id="s3" style="width: 90px;" placeholder="Form"> sehr gut Deutsch sprechen.</li>
  <li>Ihr <input type="text" id="s4" style="width: 90px;" placeholder="Form"> das Problem lösen.</li>
  <li>Du <input type="text" id="s5" style="width: 90px;" placeholder="Form"> die Tür öffnen.</li>
</ol>

      <p>
        <b>Teil 3: Keypad Entry</b>
      </p>

      <p>
        Count occurrences based on your completed table and sentences above:
      </p>

      <ul>
        <li>Digit 1: Forms with '-st' (+ sentence sheet occurrences)</li>
        <li>Digit 2: Forms with Umlaut (ö) (+ sentence sheet occurrences)</li>
        <li>Digit 3: Forms 'kann' (+ sentence sheet occurrences)</li>
        <li>Digit 4: Forms 'können' (+ sentence sheet occurrences)</li>
      </ul>

      <input
        type="text"
        id="lockCodeInput"
        maxlength="4"
        placeholder="4-Digit Lock Code">

      <button
        type="button"
        class="btn"
        onclick="verifyLock1(event)">
        Attempt Lock Clearance
      </button>

      <div id="feedback"></div>
    `;
  }


/* ============================================================
     LOCK 2: DIE SCHLIESSFÄCHER IM FLUR (MÜSSEN)
     ============================================================ */
  else if (progress === 1) {
    container.innerHTML = `
      <h3 class="lock-header">
        LOCK 2 — Die Schließfächer im Flur (müssen)
      </h3>

      <p>
        <i>„Nur wer weiß, was man in der Schule tun muss, findet den richtigen Code.“</i>
      </p>

      <p>
        <b>Teil 1: Ordnet die Wörter.</b><br>
        <span style="font-size: 0.85rem; color: #aaa; font-style: italic;">
          Bildet korrekte Sätze mit müssen. Achtet auf die Wortstellung!
        </span>
      </p>

      <ol style="padding-left: 20px; line-height: 2;">
        <li>ich / hausaufgaben / machen / meine / muss<br>
          <input type="text" id="l2_s1" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
        <li>wir / leise / sein / müssen<br>
          <input type="text" id="l2_s2" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
        <li>man / im unterricht / handy / benutzen / nicht / muss<br>
          <input type="text" id="l2_s3" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
        <li>ihr / pünktlich / sein / müsst<br>
          <input type="text" id="l2_s4" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
        <li>du / die tür / schließen / musst<br>
          <input type="text" id="l2_s5" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
        <li>schüler / in der bibliothek / essen / müssen / nicht<br>
          <input type="text" id="l2_s6" style="width: 100%; max-width: 420px;" placeholder="Satz eingeben...">
        </li>
      </ol>

      <p>
        <b>Teil 2: Welche Sätze sind logische Schulregeln?</b><br>
        <span style="font-size: 0.85rem; color: #aaa; font-style: italic;">
          Markiert nur die realistischen Verpflichtungen.
        </span>
      </p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
        <div>🔴 Rot (Satz 1): <select id="l2_r1"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
        <div>🔵 Blau (Satz 2): <select id="l2_r2"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
        <div>🟢 Grün (Satz 3): <select id="l2_r3"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
        <div>🟡 Gelb (Satz 4): <select id="l2_r4"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
        <div>🟣 Lila (Satz 5): <select id="l2_r5"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
        <div>🟠 Orange (Satz 6): <select id="l2_r6"><option value="">--</option><option value="yes">Ja</option><option value="no">Nein</option></select></div>
      </div>

      <p>
        <b>Teil 3: Findet den Code.</b><br>
        <span style="font-size: 0.85rem; color: #aaa; font-style: italic;">
          Nehmt den ersten Buchstaben des Infinitivs in jedem logischen Satz nach der Farb-Reihenfolge (Rot → Blau → Grün → Gelb → Lila). Wandelt die Buchstaben in Zahlen um (A=1, B=2...). Bei zweistelligen Zahlen rechnet die Ziffern zusammen (z. B. 19 → 1+9=10 → 1+0=1).
        </span>
      </p>

      <input type="text" id="lockCodeInput" maxlength="5" placeholder="5-Digit Lock Code">

      <button type="button" class="btn" onclick="verifyLock2(event)">
        Attempt Lock Clearance
      </button>

      <div id="feedback"></div>
    `;
  }

/* ============================================================
     LOCK 3: DIE SCHULORDNUNG (DÜRFEN)
     ============================================================ */
  else if (progress === 2) {
    container.innerHTML = `
      <h3 class="lock-header">
        LOCK 3 — Die Schulordnung (dürfen)
      </h3>

      <p>
        <i>„Nur wer weiß, was erlaubt und was verboten ist, findet den richtigen Weg.“</i>
      </p>

      <p>
        <b>Teil 1: Lest jede Regel.</b><br>
        <span style="font-size: 0.85rem; color: #aaa; font-style: italic;">
          Entscheidet für jeden Satz: <strong>Erlaubt (✅)</strong> oder <strong>Verboten (❌)</strong>.
        </span>
      </p>

      <ol style="padding-left: 20px; line-height: 2; margin-bottom: 20px;">
        <li>Man darf im Klassenzimmer essen. 
          <select id="l3_r1"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Man darf im Flur rennen. 
          <select id="l3_r2"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Schüler dürfen in der Bibliothek leise sprechen. 
          <select id="l3_r3"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Man darf im Unterricht laut Musik hören. 
          <select id="l3_r4"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Man darf abends ohne Erlaubnis in die Schule. 
          <select id="l3_r5"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Man darf während der Pause rausgehen. 
          <select id="l3_r6"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Schüler dürfen im Unterricht Fragen stellen. 
          <select id="l3_r7"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
        <li>Man darf im Klassenzimmer Fußball spielen. 
          <select id="l3_r8"><option value="">--</option><option value="yes">✅ Erlaubt</option><option value="no">❌ Verboten</option></select>
        </li>
      </ol>

      <p>
        <b>Teil 2: Findet den Weg (Pfeilschloss).</b><br>
        <span style="font-size: 0.85rem; color: #aaa; font-style: italic;">
          Beginnt bei Nummer 1. <strong>❌ Verboten = Geht nach links (L)</strong> | <strong>✅ Erlaubt = Geht nach rechts (R)</strong>.<br>
          Wählt die 4 Richtungspfeile des Codes für die ersten vier Regeln:
        </span>

  const updates = {};

/* ============================================================
   GENERIC CODE CHECK
   ============================================================ */

function verifyGenericCode(
  event,
  lockIndex,
  asciiArray
) {

  if (event && event.preventDefault) {
    event.preventDefault();
  }

  const input =
    document.getElementById(
      'lockCodeInput'
    );

  if (!input) {
    return;
  }


  const inputValue =
    input.value
      .trim()
      .toUpperCase();


  if (
    inputValue.length !==
    asciiArray.length
  ) {

    triggerFailure();

    return;

  }


  let correct = true;


  for (
    let i = 0;
    i < asciiArray.length;
    i++
  ) {

    if (
      inputValue.charCodeAt(i) !==
      asciiArray[i]
    ) {

      correct = false;

      break;

    }

  }


  if (correct) {

    triggerSuccess();

  } else {

    triggerFailure();

  }

}
