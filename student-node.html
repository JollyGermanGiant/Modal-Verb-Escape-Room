<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  Jolly Classroom Games — Student Portal
</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<style>

:root {

  --bg: #161f16;
  --panel: #2b2015;
  --panel-alt: #3a2c1b;
  --brass: #c9a24b;
  --brass-bright: #e8c96b;
  --success: #5a9e5f;
  --danger: #d16b57;
  --text: #ece3d0;
  --text-dim: #a89a80;
  --border: #4a3826;

  --font-mono:
    'JetBrains Mono',
    'Courier New',
    monospace;

}

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 16px;

  background: var(--bg);

  color: var(--text);

  font-family: var(--font-mono);

}

.container {

  max-width: 650px;

  margin: 0 auto;

}

.panel {

  background: var(--panel);

  border:
    2px solid
    var(--border);

  border-radius: 8px;

  padding: 20px;

  margin-bottom: 16px;

}

.timer-bezel {

  background: #000;

  color: var(--brass-bright);

  font-size: 1.8rem;

  font-weight: bold;

  text-align: center;

  padding: 8px;

  border-radius: 4px;

  border:
    1px solid
    var(--brass);

}

input,
select,
button {

  font-family: inherit;

  font-size: 1rem;

  padding: 10px;

  border-radius: 4px;

}

input[type=text],
select {

  background: var(--panel-alt);

  border:
    1px solid
    var(--border);

  color: var(--text);

  width: 100%;

}

.btn {

  background: var(--brass);

  color: #1a1a1a;

  border: none;

  font-weight: bold;

  cursor: pointer;

  width: 100%;

  margin-top: 10px;

}

.btn:hover {

  background:
    var(--brass-bright);

}

.btn:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}

.lock-header {

  color: var(--brass-bright);

  border-bottom:
    1px solid
    var(--border);

  padding-bottom: 8px;

}

.feedback {

  margin-top: 10px;

  padding: 10px;

  border-radius: 4px;

  text-align: center;

  font-weight: bold;

}

.feedback.correct {

  background:
    rgba(90, 158, 95, 0.2);

  color: var(--success);

  border:
    1px solid
    var(--success);

}

.feedback.wrong {

  background:
    rgba(209, 107, 87, 0.2);

  color: var(--danger);

  border:
    1px solid
    var(--danger);

}

.unlock-anim {

  animation:
    pulseGreen
    0.8s
    ease-in-out;

}

@keyframes pulseGreen {

  0% {

    transform: scale(1);

    box-shadow:
      0 0 0px
      var(--success);

  }

  50% {

    transform: scale(1.03);

    box-shadow:
      0 0 20px
      var(--success);

  }

  100% {

    transform: scale(1);

    box-shadow:
      0 0 0px
      var(--success);

  }

}

.shake {

  animation:
    shake
    0.35s;

}

@keyframes shake {

  10%, 90% {
    transform: translateX(-2px);
  }

  20%, 80% {
    transform: translateX(4px);
  }

  30%, 50%, 70% {
    transform: translateX(-8px);
  }

  40%, 60% {
    transform: translateX(8px);
  }

}

.connection {

  font-size: 0.8rem;

  color:
    var(--text-dim);

}

.connection.online {

  color:
    var(--success);

}

.connection.offline {

  color:
    var(--danger);

}

[hidden] {

  display: none !important;

}

</style>

</head>


<body>


<div class="container">


<!-- ============================================================
     JOIN SCREEN
     ============================================================ -->

<div
  id="joinScreen"
  class="panel">

  <h2 style="color:var(--brass-bright)">
    Vault Escape — Student Join
  </h2>


  <div
    id="authStatus"
    class="connection">

    Connecting to Firebase...

  </div>


  <div style="margin-bottom:12px;">

    <label>
      Room Code:
    </label>

    <input
      type="text"
      id="roomCodeInput"
      style="text-transform:uppercase"
      placeholder="e.g. AB12CD">

  </div>


  <button
    type="button"
    class="btn"
    id="connectBtn"
    onclick="connectToRoom()">

    Connect to Vault

  </button>


  <div
    id="joinStatus"
    style="
      margin-top:10px;
      font-size:0.85rem;
      color:var(--text-dim);
    ">

  </div>


  <div
    id="selectTeamArea"
    style="margin-top:15px;"
    hidden>

    <label>
      Select Your Team:
    </label>

    <select
      id="teamDropdown">
    </select>


    <button
      type="button"
      class="btn"
      onclick="enterGame()">

      Enter Control Room

    </button>

  </div>

</div>



<!-- ============================================================
     GAME SCREEN
     ============================================================ -->

<div
  id="gameScreen"
  hidden>


  <div
    class="panel"
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
    ">

    <div>

      <h3
        id="teamNameHeading"
        style="
          margin:0;
          color:var(--text);
        ">

        Team

      </h3>


      <span
        id="gameStatusTag"
        class="connection online">

        Connected

      </span>

    </div>


    <div
      class="timer-bezel"
      id="studentTimer">

      45:00

    </div>

  </div>


  <div
    id="lockCard"
    class="panel">
  </div>

</div>


</div>


<script>


/* ============================================================
   FIREBASE CONFIG
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyD1UphrW9EuX4RUQXDhEMv7MoRMwLUHwpM",
  authDomain: "jolly-classroom-games.firebaseapp.com",
  databaseURL: "https://jolly-classroom-games-default-rtdb.firebaseio.com",
  projectId: "jolly-classroom-games",
  storageBucket: "jolly-classroom-games.firebasestorage.app",
  messagingSenderId: "511334738685",
  appId: "1:511334738685:web:27ec8d6cc1142465572c94"
};


if (!firebase.apps.length) {

  firebase.initializeApp(
    firebaseConfig
  );

}


const auth =
  firebase.auth();

const db =
  firebase.database();


/* ============================================================
   STATE
   ============================================================ */

let currentUser = null;

let roomId = null;

let teamKey = null;

let roomRef = null;

let localProgress = -1;


/* ============================================================
   AUTHENTICATION
   ============================================================ */

auth.onAuthStateChanged(user => {

  if (!user) {

    document.getElementById(
      'authStatus'
    ).textContent =
      'Authentication failed.';

    document.getElementById(
      'authStatus'
    ).className =
      'connection offline';

    return;

  }


  currentUser = user;


  document.getElementById(
    'authStatus'
  ).textContent =
    'Connected to Firebase.';


  document.getElementById(
    'authStatus'
  ).className =
    'connection online';


  // If a room was supplied in the URL,
  // connect automatically.

  const params =
    new URLSearchParams(
      window.location.search
    );

  const roomParam =
    params.get('room');


  if (roomParam) {

    document.getElementById(
      'roomCodeInput'
    ).value =
      roomParam
        .trim()
        .toUpperCase();

    connectToRoom();

  }

});


auth.signInAnonymously()
  .catch(error => {

    console.error(
      'Anonymous authentication failed:',
      error
    );

    document.getElementById(
      'authStatus'
    ).textContent =
      'Could not connect to Firebase.';

    document.getElementById(
      'authStatus'
    ).className =
      'connection offline';

  });


/* ============================================================
   CONNECT TO ROOM
   ============================================================ */

async function connectToRoom() {

  if (!currentUser) {

    document.getElementById(
      'joinStatus'
    ).textContent =
      'Still connecting to Firebase. Please wait a moment.';

    return;

  }


  roomId =
    document.getElementById(
      'roomCodeInput'
    ).value
      .trim()
      .toUpperCase();


  const statusEl =
    document.getElementById(
      'joinStatus'
    );

  const btn =
    document.getElementById(
      'connectBtn'
    );


  if (!roomId) {

    statusEl.textContent =
      'Please enter a room code.';

    return;

  }


  btn.disabled = true;


  statusEl.textContent =
    'Connecting to vault server...';


  roomRef =
    db.ref(
      'rooms/' + roomId
    );


  try {

    const snapshot =
      await roomRef.once('value');


    btn.disabled = false;


    if (!snapshot.exists()) {

      statusEl.textContent =
        'Room code not found.';

      statusEl.style.color =
        'var(--danger)';

      return;

    }


    const data =
      snapshot.val();


    if (
      data.expiresAt &&
      Date.now() > data.expiresAt
    ) {

      statusEl.textContent =
        'This game room has expired.';

      statusEl.style.color =
        'var(--danger)';

      return;

    }


    statusEl.textContent =
      'Vault found! Select your team.';

    statusEl.style.color =
      'var(--success)';


    const teams =
      data.teams || {};


    const dropdown =
      document.getElementById(
        'teamDropdown'
      );


    dropdown.innerHTML = '';


    Object.keys(teams)
      .forEach(key => {

        const option =
          document.createElement(
            'option'
          );

        option.value = key;

        option.textContent =
          teams[key].name;

        dropdown.appendChild(
          option
        );

      });


    document.getElementById(
      'selectTeamArea'
    ).hidden = false;


  } catch (error) {

    console.error(error);

    btn.disabled = false;

    statusEl.textContent =
      'Connection error: ' +
      error.message;

    statusEl.style.color =
      'var(--danger)';

  }

}


/* ============================================================
   ENTER GAME
   ============================================================ */

async function enterGame() {

  if (!currentUser || !roomRef) {
    return;
  }


  teamKey =
    document.getElementById(
      'teamDropdown'
    ).value;


  const teamName =
    document.getElementById(
      'teamDropdown'
    )
      .selectedOptions[0]
      .textContent;


  /*
    Record this anonymous student as a
    member of the selected team.
  */

  try {

    await roomRef
      .child(
        `players/${currentUser.uid}`
      )
      .set({

        team:
          teamKey,

        joinedAt:
          firebase.database.ServerValue.TIMESTAMP

      });

  } catch (error) {

    console.error(
      'Could not register player:',
      error
    );

  }


  document.getElementById(
    'joinScreen'
  ).hidden = true;


  document.getElementById(
    'gameScreen'
  ).hidden = false;


  document.getElementById(
    'teamNameHeading'
  ).textContent =
    teamName;


  listenToRoom();

}
  
/* ============================================================
   ROOM LISTENER (FIXED)
   ============================================================ */

function listenToRoom() {

  roomRef.on(
    'value',
    snapshot => {

      const data = snapshot.val();

      if (!data) return;

      // 1. UPDATE TIMER (ONLY touches the timer bezel text)
      const seconds = Math.max(0, Number(data.secondsRemaining || 0));
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');

      const timerEl = document.getElementById('studentTimer');
      if (timerEl) {
        timerEl.textContent = `${minutes}:${secs}`;
      }

      // 2. UPDATE STATUS TAG
      const statusTag = document.getElementById('gameStatusTag');
      if (statusTag) {
        statusTag.textContent = String(data.status || 'setup').toUpperCase();
      }

      // 3. CHECK TEAM PROGRESS
      const teamData = data.teams && data.teams[teamKey];
      if (!teamData) return;

      document.getElementById('teamNameHeading').textContent = teamData.name;

      const serverProgress = Number(teamData.progress || 0);

      // ONLY re-render the lock puzzle if progress level has changed!
      // On initial load (localProgress === -1) or when moving to next lock.
      if (localProgress === -1 || serverProgress > localProgress) {
        localProgress = serverProgress;
        renderLockPuzzle(localProgress, teamData.finished);
      }

    }
  );

}
/* ============================================================
   RENDER PUZZLES
   ============================================================ */

function renderLockPuzzle(
  progress,
  finished
) {

  const container =
    document.getElementById(
      'lockCard'
    );


  container.classList.remove(
    'unlock-anim'
  );


  if (
    finished ||
    progress >= 6
  ) {

    container.innerHTML = `

      <h2
        style="
          color:var(--success);
          text-align:center;
        ">

        🔓 VAULT OPENED!

      </h2>


      <p
        style="
          text-align:center;
        ">

        Congratulations!

        Your team successfully
        decoded all six security locks
        and escaped the room!

      </p>

    `;

    return;

  }


  if (progress === 0) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 1 —
        Der verschlossene Klassenraum
        (können)

      </h3>


      <p>

        <i>
          „Nur wer zeigen kann,
          was er kann,
          darf weitergehen."
        </i>

      </p>


      <p>
        <b>
          Teil 1: Conjugation Check
        </b>
      </p>


      <div
        style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:6px;
          margin-bottom:12px;
        ">


        <div>
          ich
          <input
            type="text"
            id="l1_1"
            placeholder="Form">
        </div>


        <div>
          wir
          <input
            type="text"
            id="l1_4"
            placeholder="Form">
        </div>


        <div>
          du
          <input
            type="text"
            id="l1_2"
            placeholder="Form">
        </div>


        <div>
          ihr
          <input
            type="text"
            id="l1_5"
            placeholder="Form">
        </div>


        <div>
          er/sie/es
          <input
            type="text"
            id="l1_3"
            placeholder="Form">
        </div>


        <div>
          sie/Sie
          <input
            type="text"
            id="l1_6"
            placeholder="Form">
        </div>

      </div>


      <p>
        <b>
          Teil 2: Keypad Entry
        </b>
      </p>


      <p>
        Count occurrences based on your
        completed table and sentence worksheets:
      </p>


      <ul>

        <li>
          Forms with '-st'
        </li>

        <li>
          Forms with Umlaut (ö)
        </li>

        <li>
          Forms 'kann'
        </li>

        <li>
          Forms 'können'
        </li>

      </ul>


      <input
        type="text"
        id="lockCodeInput"
        maxlength="4"
        placeholder="4-Digit Lock Code">


<button
        type="button"
        class="btn"
        onclick="verifyLock1(event)">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }


  else if (progress === 1) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 2 —
        Die Schließfächer im Flur
        (müssen)

      </h3>


      <p>

        Solve the school rules puzzle.
        Convert final color-ordered letters
        (M-S-B-S-S) using single-digit
        alphabet values.

      </p>


      <input
        type="text"
        id="lockCodeInput"
        maxlength="5"
        placeholder="5-Digit Lock Code">


      <button
      type="button"
        class="btn"
        onclick="
          verifyGenericCode(event,
            1,
            [52,49,50,49,49]
          )
        ">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }


  else if (progress === 2) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 3 —
        Die Schulordnung
        (dürfen)

      </h3>


      <p>

        Enter the 4 directional arrows
        representing the first 4 rule decisions.

        Use L for Left/Verboten,
        R for Right/Erlaubt.

      </p>


      <input
        type="text"
        id="lockCodeInput"
        placeholder="4 Directions (e.g. LLRR)">


      <button
      type="button"
        class="btn"
        onclick="
          verifyGenericCode(event,
            2,
            [76,76,76,82]
          )
        ">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }


  else if (progress === 3) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 4 —
        Was wollen sie wirklich?
        (wollen)

      </h3>


      <p>

        Enter the calculated 4-digit
        code based on who is telling
        the truth.

      </p>


      <input
        type="text"
        id="lockCodeInput"
        placeholder="4-Digit Code">


      <button
      type="button"
        class="btn"
        onclick="
          verifyGenericCode(event,
            3,
            [48,48,50,56]
          )
        ">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }


  else if (progress === 4) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 5 —
        Die geheime Nachricht
        (sollen)

      </h3>


      <p>

        Enter the calculated final total
        (Warnings × Expectations +
        Word count of last sentence).

      </p>


      <input
        type="text"
        id="lockCodeInput"
        placeholder="2-Digit Code">


      <button
      type="button"
        class="btn"
        onclick="
          verifyGenericCode(event,
            4,
            [49,57]
          )
        ">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }


  else if (progress === 5) {

    container.innerHTML = `

      <h3 class="lock-header">

        LOCK 6 —
        Der Hausmeister kommt...
        (möchten)

      </h3>


      <p>

        Enter the final
        4-digit master escape sequence.

      </p>


      <input
        type="text"
        id="lockCodeInput"
        placeholder="4-Digit Code">


      <button
      type="button"
        class="btn"
        onclick="
          verifyGenericCode(event,
            5,
            [50,49,49,52]
          )
        ">

        Attempt Lock Clearance

      </button>


      <div id="feedback"></div>

    `;

  }

}


/* ============================================================
   SUCCESS
   ============================================================ */

async function triggerSuccess() {
  const container = document.getElementById('lockCard');
  const feedback = document.getElementById('feedback');

  if (feedback) {
    feedback.className = 'feedback correct';
    feedback.innerHTML = '🔓 LOCK UNLOCKED!';
  }

  if (container) {
    container.classList.add('unlock-anim');
  }

  // 1. Instantly advance the local progress variable
  localProgress = localProgress + 1;

  // 2. Immediately re-render to the next room/lock UI
  renderLockPuzzle(localProgress, localProgress >= 6);

  // 3. Prepare the Firebase update payload
  const updates = {};
  updates[`teams/${teamKey}/progress`] = localProgress;

  if (localProgress >= 6) {
    updates[`teams/${teamKey}/finished`] = true;
    const timerElem = document.getElementById('studentTimer');
    updates[`teams/${teamKey}/finishTime`] = timerElem ? timerElem.textContent : '00:00';
  }

  // 4. Async update to Firebase
  try {
    await roomRef.update(updates);
  } catch (error) {
    console.error('Could not update progress:', error);
    if (feedback) {
      feedback.className = 'feedback wrong';
      feedback.innerHTML = 'Connection error. Please try again.';
    }
  }
}


/* ============================================================
   FAILURE
   ============================================================ */

function triggerFailure() {

  const feedback =
    document.getElementById(
      'feedback'
    );

  const input =
    document.getElementById(
      'lockCodeInput'
    );


  feedback.className =
    'feedback wrong';

  feedback.innerHTML =
    'Not quite. Check your work.';


  if (input) {

    input.classList.add(
      'shake'
    );


    setTimeout(() => {

      input.classList.remove(
        'shake'
      );

    }, 400);

  }

}


/* ============================================================
   LOCK 1
   ============================================================ */

/* ============================================================
   LOCK 1 VERIFICATION
   ============================================================ */
function verifyLock1(event) {
  if (event) {
    event.preventDefault(); // Prevents the browser page refresh!
  }

  const getVal = (id) => document.getElementById(id)?.value.trim().toLowerCase() || '';

  const c1 = getVal('l1_1') === 'kann';
  const c2 = getVal('l1_2') === 'kannst';
  const c3 = getVal('l1_3') === 'kann';
  const c4 = getVal('l1_4') === 'können';
  const c5 = getVal('l1_5') === 'könnt' || getVal('l1_5') === 'konnt';
  const c6 = getVal('l1_6') === 'können';

  const codeInput = document.getElementById('lockCodeInput')?.value.trim() || '';

  if (c1 && c2 && c3 && c4 && c5 && c6 && codeInput === '2523') {
    triggerSuccess();
  } else {
    triggerFailure();
  }
}

/* ============================================================
   SUCCESS HANDLER
   ============================================================ */
async function triggerSuccess() {
  const container = document.getElementById('lockCard');
  const feedback = document.getElementById('feedback');

  if (feedback) {
    feedback.className = 'feedback correct';
    feedback.innerHTML = '🔓 LOCK UNLOCKED!';
  }

  if (container) {
    container.classList.add('unlock-anim');
  }

  // Advance local state immediately
  localProgress = Math.max(0, localProgress) + 1;

  const updates = {};
  updates[`teams/${teamKey}/progress`] = localProgress;

  if (localProgress >= 6) {
    updates[`teams/${teamKey}/finished`] = true;
    updates[`teams/${teamKey}/finishTime`] = document.getElementById('studentTimer')?.textContent || '00:00';
  }

  // Instantly re-render the screen to Lock 2 without waiting for network bounce
  renderLockPuzzle(localProgress, localProgress >= 6);

  // Sync to database
  if (roomRef && teamKey) {
    try {
      await roomRef.update(updates);
    } catch (error) {
      console.error('Database update failed:', error);
    }
  }
}

/* ============================================================
   GENERIC CODE CHECK
   ============================================================ */

function verifyGenericCode(
  event,
  lockIndex,
  asciiArray
) {

  if (event && event.preventDefault) {
    event.preventDefault();
  }

  const input =
    document.getElementById(
      'lockCodeInput'
    );

  if (!input) {
    return;
  }


  const inputValue =
    input.value
      .trim()
      .toUpperCase();


  if (
    inputValue.length !==
    asciiArray.length
  ) {

    triggerFailure();

    return;

  }


  let correct = true;


  for (
    let i = 0;
    i < asciiArray.length;
    i++
  ) {

    if (
      inputValue.charCodeAt(i) !==
      asciiArray[i]
    ) {

      correct = false;

      break;

    }

  }


  if (correct) {

    triggerSuccess();

  } else {

    triggerFailure();

  }

}


</script>
